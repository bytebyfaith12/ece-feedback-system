<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ECE Pulse - Feedback Kiosk</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Using Inter as a fallback for 'metropolis' since it's commonly available and fits the clean aesthetic -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "secondary": "#c6c6cd",
                        "on-secondary-fixed": "#1a1b21",
                        "primary": "#e0fdff",
                        "outline": "#849495",
                        "on-secondary-fixed-variant": "#45474c",
                        "on-primary-fixed": "#002022",
                        "surface-bright": "#333b3b",
                        "tertiary-fixed-dim": "#e8c423",
                        "surface-container": "#192122",
                        "secondary-container": "#47494f",
                        "surface-container-high": "#232b2c",
                        "secondary-fixed": "#e2e2e9",
                        "surface-container-lowest": "#081010",
                        "on-primary-container": "#006a70",
                        "on-tertiary-fixed-variant": "#554500",
                        "surface-dim": "#0d1515",
                        "inverse-on-surface": "#2a3232",
                        "primary-fixed": "#6ff6ff",
                        "on-tertiary-container": "#725e00",
                        "surface-container-low": "#151d1e",
                        "surface-tint": "#00dce6",
                        "tertiary": "#fff6e4",
                        "background": "#0d1515",
                        "on-tertiary": "#3b2f00",
                        "inverse-primary": "#00696f",
                        "on-primary-fixed-variant": "#004f53",
                        "on-tertiary-fixed": "#221b00",
                        "inverse-surface": "#dce4e4",
                        "error": "#ffb4ab",
                        "on-surface": "#dce4e4",
                        "on-background": "#dce4e4",
                        "on-surface-variant": "#b9cacb",
                        "tertiary-fixed": "#ffe173",
                        "on-primary": "#00373a",
                        "surface-container-highest": "#2e3637",
                        "surface-variant": "#2e3637",
                        "on-secondary-container": "#b7b8bf",
                        "outline-variant": "#3a494b",
                        "tertiary-container": "#fed83a",
                        "on-secondary": "#2e3036",
                        "secondary-fixed-dim": "#c6c6cd",
                        "surface": "#0d1515",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#00dce6",
                        "primary-container": "#00f2fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "20px",
                        "container-padding": "24px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "widget-gap": "24px"
                    },
                    "fontFamily": {
                        "display-kpi": ["Inter", "sans-serif"],
                        "display-kpi-mobile": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-sm": ["JetBrains Mono", "monospace"],
                        "headline-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "display-kpi": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-kpi-mobile": ["36px", { "lineHeight": "44px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom overrides to handle missing metropolis font gracefully, mapping to Inter */
        .font-display-kpi, .font-display-kpi-mobile, .font-body-lg, .font-body-md, .font-headline-md, .font-headline-lg {
            font-family: 'Inter', sans-serif;
        }
        .font-label-sm {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Hide default checkbox */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00dce6; /* surface-tint */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: rgba(0, 220, 230, 0.2); /* surface-tint with opacity */
            border-color: #00dce6;
        }
        
        /* Active feedback sim for touch */
        .touch-btn:active {
            transform: scale(0.97);
            background-color: rgba(0, 242, 254, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col relative selection:bg-surface-tint selection:text-surface-container-lowest">
<!-- Atmospheric Depth Layer (Level 0 Base) -->
<div class="absolute inset-0 pointer-events-none z-0">
<!-- Radial gradient background for deep command center feel -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-highest/40 via-background to-background"></div>
<!-- Glowing Orbs for brand accent -->
<div class="absolute top-[5%] left-[10%] w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[800px] h-[800px] bg-surface-tint/5 rounded-full blur-[150px]"></div>
</div>
<!-- Top Header Bar -->
<header class="w-full flex justify-between items-center px-container-padding py-6 z-10 relative">
<!-- Brand Identity -->
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-container border border-white/10 flex items-center justify-center shadow-[0_0_15px_rgba(0,242,254,0.1)]">
<span class="material-symbols-outlined text-surface-tint">sensors</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-primary drop-shadow-[0_0_8px_rgba(0,220,230,0.5)] leading-none tracking-tight">ECE Pulse</h2>
<span class="font-label-sm text-label-sm text-on-surface-variant/80 uppercase tracking-widest mt-1 block">Feedback Terminal</span>
</div>
</div>
<!-- Language Switcher Control -->
<button class="group flex items-center gap-2 px-5 py-3 rounded-full bg-white/[0.03] backdrop-blur-md border border-outline-variant/30 hover:border-surface-tint/40 hover:bg-white/[0.08] transition-all duration-300">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-surface-tint transition-colors">language</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors">English (US)</span>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-surface-tint transition-colors">expand_more</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center z-10 relative px-container-padding w-full max-w-7xl mx-auto -mt-10">
<!-- Primary Question -->
<div class="text-center mb-16 space-y-4">
<h1 class="font-display-kpi text-display-kpi text-primary drop-shadow-[0_0_20px_rgba(224,253,255,0.2)]">
                How was your experience?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                Your input directly calibrates our operational standards. Tap an option below.
            </p>
</div>
<!-- Feedback Controls (5 Large Smileys) -->
<!-- Level 1 (Cards): Translucent glass layer. background: rgba(255, 255, 255, 0.03), backdrop-filter: blur(12px) -->
<div class="flex justify-center items-center gap-widget-gap w-full flex-wrap">
<!-- Option 1: Very Unsatisfied -->
<button class="touch-btn group relative flex flex-col items-center justify-center p-8 rounded-2xl bg-white/[0.03] backdrop-blur-[12px] border border-outline-variant/30 hover:border-error/60 transition-all duration-300 hover:-translate-y-2 hover:bg-error/5 hover:shadow-[0_0_25px_rgba(255,180,171,0.15)] w-[200px] h-[240px] overflow-hidden">
<span class="material-symbols-outlined text-[88px] text-on-surface-variant group-hover:text-error transition-colors duration-300 mb-6 drop-shadow-lg" style="font-variation-settings: 'FILL' 0;">sentiment_very_dissatisfied</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-on-surface transition-colors duration-300 text-center leading-tight">Very<br/>Unsatisfied</span>
</button>
<!-- Option 2: Unsatisfied -->
<button class="touch-btn group relative flex flex-col items-center justify-center p-8 rounded-2xl bg-white/[0.03] backdrop-blur-[12px] border border-outline-variant/30 hover:border-tertiary-container/60 transition-all duration-300 hover:-translate-y-2 hover:bg-tertiary-container/5 hover:shadow-[0_0_25px_rgba(254,216,58,0.15)] w-[200px] h-[240px] overflow-hidden">
<span class="material-symbols-outlined text-[88px] text-on-surface-variant group-hover:text-tertiary-container transition-colors duration-300 mb-6 drop-shadow-lg" style="font-variation-settings: 'FILL' 0;">sentiment_dissatisfied</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-on-surface transition-colors duration-300 text-center leading-tight">Unsatisfied</span>
</button>
<!-- Option 3: Neutral -->
<button class="touch-btn group relative flex flex-col items-center justify-center p-8 rounded-2xl bg-white/[0.03] backdrop-blur-[12px] border border-outline-variant/30 hover:border-outline/80 transition-all duration-300 hover:-translate-y-2 hover:bg-outline/10 hover:shadow-[0_0_25px_rgba(132,148,149,0.2)] w-[200px] h-[240px] overflow-hidden">
<span class="material-symbols-outlined text-[88px] text-on-surface-variant group-hover:text-inverse-surface transition-colors duration-300 mb-6 drop-shadow-lg" style="font-variation-settings: 'FILL' 0;">sentiment_neutral</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-on-surface transition-colors duration-300 text-center leading-tight">Neutral</span>
</button>
<!-- Option 4: Satisfied -->
<button class="touch-btn group relative flex flex-col items-center justify-center p-8 rounded-2xl bg-white/[0.03] backdrop-blur-[12px] border border-outline-variant/30 hover:border-surface-tint/80 transition-all duration-300 hover:-translate-y-2 hover:bg-surface-tint/5 hover:shadow-[0_0_25px_rgba(0,220,230,0.2)] w-[200px] h-[240px] overflow-hidden">
<span class="material-symbols-outlined text-[88px] text-on-surface-variant group-hover:text-surface-tint transition-colors duration-300 mb-6 drop-shadow-lg" style="font-variation-settings: 'FILL' 0;">sentiment_satisfied</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-on-surface transition-colors duration-300 text-center leading-tight">Satisfied</span>
</button>
<!-- Option 5: Very Satisfied -->
<button class="touch-btn group relative flex flex-col items-center justify-center p-8 rounded-2xl bg-white/[0.03] backdrop-blur-[12px] border border-outline-variant/30 hover:border-primary-container transition-all duration-300 hover:-translate-y-2 hover:bg-primary-container/10 hover:shadow-[0_0_30px_rgba(0,242,254,0.3)] w-[200px] h-[240px] overflow-hidden">
<!-- Inner glow effect for primary action equivalent -->
<div class="absolute inset-0 bg-gradient-to-t from-primary-container/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
<span class="material-symbols-outlined text-[88px] text-on-surface-variant group-hover:text-primary-container transition-colors duration-300 mb-6 drop-shadow-[0_0_12px_rgba(0,242,254,0.5)]" style="font-variation-settings: 'FILL' 0;">sentiment_very_satisfied</span>
<span class="font-headline-md text-headline-md text-on-surface-variant group-hover:text-primary-container transition-colors duration-300 text-center leading-tight">Very<br/>Satisfied</span>
</button>
</div>
</main>
<!-- Bottom Footer Bar (Controls & Hand-off) -->
<footer class="w-full flex justify-between items-end px-container-padding py-8 z-10 relative">
<!-- Anonymous Mode Toggle -->
<div class="flex items-center gap-4 bg-surface-container-high/60 backdrop-blur-xl p-4 pr-6 rounded-xl border border-white/5 shadow-lg">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-on-surface border-4 border-surface-container appearance-none cursor-pointer transition-all duration-300 z-10" id="anonymous-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-lowest cursor-pointer border border-outline-variant/50 transition-colors duration-300" for="anonymous-toggle"></label>
</div>
<div class="flex flex-col">
<label class="font-body-lg text-body-lg text-on-surface cursor-pointer select-none" for="anonymous-toggle">Anonymous Mode</label>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Response untethered from user profile.</span>
</div>
</div>
<!-- Mobile Handoff (QR Code) -->
<div class="flex items-center gap-5 bg-surface-container-high/60 backdrop-blur-xl p-4 rounded-xl border border-white/5 shadow-lg group hover:border-surface-tint/30 transition-colors duration-300 cursor-pointer">
<div class="text-right">
<p class="font-body-md text-body-md text-on-surface">Continue on Mobile</p>
<p class="font-label-sm text-label-sm text-surface-tint mt-1 group-hover:text-primary-fixed transition-colors">Scan QR Code</p>
</div>
<div class="w-16 h-16 bg-white p-1.5 rounded-lg flex items-center justify-center shadow-[0_0_10px_rgba(0,220,230,0.1)] group-hover:shadow-[0_0_15px_rgba(0,220,230,0.3)] transition-shadow">
<!-- Scalable pure CSS representation of a QR code using grid, avoiding images -->
<div class="w-full h-full grid grid-cols-4 grid-rows-4 gap-0.5 p-0.5">
<div class="bg-surface-container-lowest col-span-2 row-span-2 rounded-sm border-2 border-white"></div>
<div class="bg-surface-container-lowest col-start-4 row-start-1 rounded-sm"></div>
<div class="bg-surface-container-lowest col-start-3 row-start-2 rounded-sm"></div>
<div class="bg-surface-container-lowest col-span-2 row-span-2 col-start-1 row-start-3 rounded-sm border-2 border-white"></div>
<div class="bg-surface-container-lowest col-start-3 row-start-3 rounded-sm"></div>
<div class="bg-surface-container-lowest col-start-4 row-start-3 rounded-sm"></div>
<div class="bg-surface-container-lowest col-span-2 row-start-4 col-start-3 rounded-sm"></div>
</div>
</div>
</div>
</footer>
</body></html>
